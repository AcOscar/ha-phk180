title: PHK 180
views:
  # ---------------------------------------------------------------------------
  # TAB 1: Übersicht (Gliederung in Steuerung, Sensoren & Schaltzustände)
  # ---------------------------------------------------------------------------
  - title: Übersicht
    path: uebersicht
    icon: mdi:hvac
    badges:
      - entity: sensor.phk180_betriebsart
      - entity: sensor.phk180_luftungsstufe
      - entity: sensor.phk180_volumenstrom
      - entity: sensor.phk180_storungsmeldung
    cards:
      # === BEREICH 1: STEUERUNG ===
      - type: vertical-stack
        cards:
          - type: entities
            title: Steuerung – Betriebsart & Lüftung
            show_header_toggle: false
            entities:
              - entity: select.phk180_betriebsart_auswahl
                name: Betriebsart wählen
              - entity: select.phk180_luftungsstufe_auswahl
                name: Lüftungsstufe wählen
              - entity: switch.phk180_stossluftung
                name: Stoßlüftung aktivieren
              - entity: switch.phk180_sommerbetrieb_jahreszeit
                name: Jahreszeit Sommerbetrieb
              - entity: button.phk180_wp_vorrangschaltung_umschalten
                name: Vorrangschaltung WP umschalten
              - entity: switch.phk180_legionellenschutz
                name: Legionellenschutz
              - entity: button.phk180_storung_reset
                name: Störung quittieren (Reset)

          - type: entities
            title: Steuerung – Ferienabwesenheit
            show_header_toggle: false
            entities:
              - entity: date.phk180_ferien_ruckreisedatum
                name: Ferien Rückreisedatum einstellen
              - entity: number.phk180_absenktemperatur_ferien
                name: Absenktemperatur Ferien (18–20 °C)
              - entity: button.phk180_ferienbetrieb_beenden
                name: Ferienbetrieb beenden (Auto Zeit)

          - type: entities
            title: Steuerung – Datum & Uhrzeit
            show_header_toggle: false
            entities:
              - entity: date.phk180_systemdatum
                name: Systemdatum einstellen
              - entity: time.phk180_systemuhrzeit
                name: Systemuhrzeit einstellen
              - entity: button.phk180_systemzeit_synchronisieren
                name: Datum & Uhrzeit mit Home Assistant synchronisieren

          - type: entities
            title: Steuerung – Sollwerte & Parameter
            show_header_toggle: false
            entities:
              - entity: number.phk180_raumsolltemperatur
                name: Raumsolltemperatur (18,0–25,0 °C)
              - entity: number.phk180_abgleich_raumtemperatur
                name: Abgleich Raumtemperatur (-3,0 bis +3,0 K)
              - entity: number.phk180_einschaltpunkt_zh_zuluft
                name: Einschaltpunkt ZH Zuluft (-2,0 bis -0,4 K)
              - entity: number.phk180_warmwassersolltemperatur
                name: Warmwassersolltemperatur (30–50 °C)
              - entity: number.phk180_ww_hysterese_warmepumpe
                name: WW-Ausschalthysterese Wärmepumpe (5–10 K)
              - entity: number.phk180_ww_hysterese_e_heizstab
                name: WW-Ausschalthysterese E-Heizstab (5–15 K)
              - entity: number.phk180_dauer_stossluftung
                name: Dauer Stoßlüftung (5–90 min)

      # === BEREICH 2: SENSOREN (MESSWERTE) ===
      - type: vertical-stack
        cards:
          - type: glance
            title: Sensoren – Temperaturen (Messwerte)
            columns: 3
            entities:
              - entity: sensor.phk180_t_raum
                name: T-Raum
              - entity: sensor.phk180_t_lufteintritt
                name: T-Lufteintritt
              - entity: sensor.phk180_t_zuluft
                name: T-Zuluft
              - entity: sensor.phk180_t_abluft
                name: T-Abluft
              - entity: sensor.phk180_t_verdampfer
                name: T-Verdampfer
              - entity: sensor.phk180_t_speicher_e_heizstab_oben
                name: Speicher Oben (EHZ)
              - entity: sensor.phk180_t_speicher_warmepumpe_unten
                name: Speicher Unten (WP)

          - type: entities
            title: Sensoren – Luft, CO2, Feuchte & Filter
            show_header_toggle: false
            entities:
              - entity: sensor.phk180_volumenstrom
              - entity: sensor.phk180_drehzahl_aussenluft
              - entity: sensor.phk180_drehzahl_fortluft
              - entity: sensor.phk180_co2_sensor_1_wohnzimmer
              - entity: sensor.phk180_co2_sensor_2_wc
              - entity: sensor.phk180_co2_sensor_3_kuche
              - entity: sensor.phk180_rel_luftfeuchte
              - entity: sensor.phk180_restlaufzeit_aussenfilter
              - entity: sensor.phk180_restlaufzeit_geratefilter
              - entity: button.phk180_filterwechsel_aussenfilter_quittieren
              - entity: button.phk180_filterwechsel_geratefilter_quittieren

      # === BEREICH 3: SCHALTZUSTÄNDE & BETRIEBSSTUNDEN ===
      - type: vertical-stack
        cards:
          - type: glance
            title: Schaltzustände – Ausgänge & Eingänge
            columns: 4
            entities:
              - entity: binary_sensor.phk180_ventilator_aussenluft
                name: Lüfter AUL
              - entity: binary_sensor.phk180_ventilator_fortluft
                name: Lüfter FOL
              - entity: sensor.phk180_sommer_bypass
                name: Bypass
              - entity: binary_sensor.phk180_kompressor_warmepumpe
                name: Kompressor
              - entity: binary_sensor.phk180_speicherladepumpe
                name: Ladepumpe
              - entity: sensor.phk180_umschaltventil_stellung
                name: 4/2-Ventil
              - entity: binary_sensor.phk180_mv_anlaufentlastung
                name: MV Anlauf
              - entity: binary_sensor.phk180_mv_flussigleitung
                name: MV Flüssig
              - entity: binary_sensor.phk180_e_heizstab_speicher
                name: E-Heizstab
              - entity: binary_sensor.phk180_zusatzheizung_zuluft
                name: ZH Zuluft
              - entity: binary_sensor.phk180_zusatzheizung_raum
                name: ZH Raum
              - entity: binary_sensor.phk180_turkontakt_offen
                name: Türkontakt

          - type: entities
            title: Schaltzustände – Status & Betriebsstunden
            show_header_toggle: false
            entities:
              - entity: sensor.phk180_betriebsart
              - entity: sensor.phk180_luftungsstufe
              - entity: sensor.phk180_jahreszeit
              - entity: sensor.phk180_vorrangschaltung_wp
              - entity: sensor.phk180_storungsmeldung
              - entity: sensor.phk180_betriebsstunden_feuchteschutzluftung
              - entity: sensor.phk180_betriebsstunden_reduzierte_luftung
              - entity: sensor.phk180_betriebsstunden_nennluftung
              - entity: sensor.phk180_betriebsstunden_intensivluftung
              - entity: sensor.phk180_betriebsstunden_luftung_gesamt
              - entity: sensor.phk180_betriebsstunden_warmepumpe
              - entity: sensor.phk180_betriebsstunden_trinkwassererwarmung
              - entity: sensor.phk180_betriebsstunden_zh_zuluft
              - entity: sensor.phk180_betriebsstunden_zh_raum
              - entity: sensor.phk180_betriebsstunden_e_heizstab
              - entity: sensor.phk180_betriebsstunden_sole_umwalzpumpe
              - entity: sensor.phk180_betriebsstunden_solar_umwalzpumpe
              - entity: sensor.phk180_betriebsstunden_ofen_umwalzpumpe
              - entity: sensor.phk180_betriebsstunden_evu_sperre

  # ---------------------------------------------------------------------------
  # TAB 2: Live-Anlagenschema (Overlay)
  # ---------------------------------------------------------------------------
  - title: Anlagenschema
    path: schema
    icon: mdi:vector-polyline
    panel: true
    cards:
      - type: picture-elements
        image: /local/phk180/phk180_schema.svg
        elements:
          - type: state-label
            entity: sensor.phk180_t_lufteintritt
            prefix: "AUL: "
            style:
              top: 25%
              left: 11%
              color: "#38bdf8"
              font-weight: bold
              background-color: "rgba(15, 23, 42, 0.85)"
              padding: "4px 8px"
              border-radius: "6px"
          - type: state-label
            entity: sensor.phk180_t_abluft
            prefix: "ABL: "
            style:
              top: 25%
              left: 56%
              color: "#fb923c"
              font-weight: bold
              background-color: "rgba(15, 23, 42, 0.85)"
              padding: "4px 8px"
              border-radius: "6px"
          - type: state-label
            entity: sensor.phk180_t_zuluft
            prefix: "ZUL: "
            style:
              top: 41%
              left: 56%
              color: "#4ade80"
              font-weight: bold
              background-color: "rgba(15, 23, 42, 0.85)"
              padding: "4px 8px"
              border-radius: "6px"
          - type: state-label
            entity: sensor.phk180_t_verdampfer
            prefix: "Verd.: "
            style:
              top: 57%
              left: 11%
              color: "#38bdf8"
              font-weight: bold
              background-color: "rgba(15, 23, 42, 0.85)"
              padding: "4px 8px"
              border-radius: "6px"
          - type: state-label
            entity: sensor.phk180_t_speicher_e_heizstab_oben
            prefix: "Oben: "
            style:
              top: 35%
              left: 82%
              color: "#f87171"
              font-weight: bold
              background-color: "rgba(15, 23, 42, 0.85)"
              padding: "4px 8px"
              border-radius: "6px"
          - type: state-label
            entity: sensor.phk180_t_speicher_warmepumpe_unten
            prefix: "Unten: "
            style:
              top: 64%
              left: 82%
              color: "#fb923c"
              font-weight: bold
              background-color: "rgba(15, 23, 42, 0.85)"
              padding: "4px 8px"
              border-radius: "6px"
          - type: state-label
            entity: sensor.phk180_umschaltventil_stellung
            prefix: "4/2-Ventil: "
            style:
              top: 69.5%
              left: 43%
              color: "#f8fafc"
              font-weight: bold
              background-color: "rgba(15, 23, 42, 0.85)"
              padding: "4px 8px"
              border-radius: "6px"
          - type: state-icon
            entity: binary_sensor.phk180_ventilator_aussenluft
            state_color: true
            style:
              top: 31%
              left: 16.7%
              transform: translate(-50%, -50%) scale(1.3)
          - type: state-icon
            entity: binary_sensor.phk180_ventilator_fortluft
            state_color: true
            style:
              top: 46.7%
              left: 16.7%
              transform: translate(-50%, -50%) scale(1.3)
          - type: state-icon
            entity: binary_sensor.phk180_sommer_bypass_offen
            state_color: true
            style:
              top: 22%
              left: 31.7%
              transform: translate(-50%, -50%)
          - type: state-icon
            entity: binary_sensor.phk180_kompressor_warmepumpe
            state_color: true
            style:
              top: 69.3%
              left: 31.7%
              transform: translate(-50%, -50%) scale(1.5)
          - type: state-icon
            entity: binary_sensor.phk180_mv_anlaufentlastung
            state_color: true

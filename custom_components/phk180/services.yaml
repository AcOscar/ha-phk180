set_vacation_return_date:
  name: Ferien-Rückreisedatum setzen
  description: Überträgt das Rückreisedatum für den Ferienbetrieb im Format TT-MM-JJJJ an Parameter D[1] der PHK 180 Anlage.
  fields:
    return_date:
      name: Rückreisedatum
      description: Datum im Format YYYY-MM-DD (z. B. 2026-12-26)
      required: true
      example: "2026-12-26"
      selector:
        date:

sync_system_date:
  name: Systemdatum synchronisieren
  description: Synchronisiert das aktuelle Systemdatum von Home Assistant mit dem Parameter D[0] der PHK 180 Anlage.

sync_system_datetime:
  name: Systemdatum & Uhrzeit synchronisieren
  description: Synchronisiert sowohl die aktuelle Uhrzeit (T[1]/T[0]) als auch das Systemdatum (D[0]) von Home Assistant mit der PHK 180 Anlage.
